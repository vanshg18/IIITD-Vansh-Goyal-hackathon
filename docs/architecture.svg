<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
<title id="title">EventPulse architecture</title>
<desc id="desc">Public sources flow through normalized ingestion and pretrained NLP into a canonical financial event, which powers a mock-index rebalancer and synthetic banking stress tester.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#78a6d8"/></marker><style>
.bg{fill:#0b1220}.panel{fill:#111d2f;stroke:#36516e;stroke-width:2}.blue{fill:#142b45;stroke:#5a9fe8;stroke-width:2}.teal{fill:#123b3a;stroke:#38d6b2;stroke-width:2}.purple{fill:#2d2547;stroke:#b7a3ff;stroke-width:2}.amber{fill:#3a2b18;stroke:#f2b65d;stroke-width:2}.h{font:700 25px Arial,sans-serif;fill:#f0f6ff}.sub{font:700 19px Arial,sans-serif;fill:#f0f6ff}.t{font:16px Arial,sans-serif;fill:#b6c8dc}.arrow{stroke:#78a6d8;stroke-width:3;fill:none;marker-end:url(#arr)}
</style></defs>
<rect class="bg" width="1500" height="980" rx="18"/>
<text class="h" x="55" y="48">EVENTPULSE ARCHITECTURE</text><text class="t" x="55" y="78">From public headlines to structured risk signals and simulations</text>
<rect class="panel" x="45" y="105" width="1410" height="100" rx="16"/><text class="sub" x="750" y="137" text-anchor="middle">1. DATA INGESTION</text>
<rect class="blue" x="78" y="150" width="400" height="42" rx="10"/><text class="sub" x="278" y="177" text-anchor="middle">GDELT DOC API</text>
<rect class="blue" x="550" y="150" width="400" height="42" rx="10"/><text class="sub" x="750" y="177" text-anchor="middle">SEC EDGAR 8-K filings</text>
<rect class="blue" x="1022" y="150" width="400" height="42" rx="10"/><text class="sub" x="1222" y="177" text-anchor="middle">Optional Alpha Vantage</text>
<path class="arrow" d="M750 205 V230"/>
<rect class="panel" x="230" y="230" width="1040" height="75" rx="16"/><text class="sub" x="750" y="258" text-anchor="middle">2. NORMALIZE, ARCHIVE AND DEDUPLICATE</text><text class="t" x="750" y="285" text-anchor="middle">Article schema · timestamps / source / URL · JSONL archive · separate processed registry</text>
<path class="arrow" d="M750 305 V330"/>
<rect class="panel" x="45" y="330" width="1410" height="265" rx="16"/><text class="sub" x="70" y="362">3. NLP AND EVENT INTELLIGENCE</text>
<rect class="teal" x="75" y="385" width="410" height="75" rx="12"/><text class="sub" x="280" y="413" text-anchor="middle">FinBERT sentiment</text><text class="t" x="280" y="439" text-anchor="middle">ProsusAI/finbert · score [-1, 1]</text>
<rect class="teal" x="545" y="385" width="410" height="75" rx="12"/><text class="sub" x="750" y="413" text-anchor="middle">Event classification router</text><text class="t" x="750" y="439" text-anchor="middle">Finance-topic model + zero-shot ModernBERT</text>
<rect class="teal" x="1015" y="385" width="410" height="75" rx="12"/><text class="sub" x="1220" y="413" text-anchor="middle">Entity and ticker resolution</text><text class="t" x="1220" y="439" text-anchor="middle">Financial NER + source/entity merge</text>
<rect class="teal" x="75" y="485" width="410" height="75" rx="12"/><text class="sub" x="280" y="513" text-anchor="middle">Semantic embeddings</text><text class="t" x="280" y="539" text-anchor="middle">BAAI/bge-small-en-v1.5</text>
<rect class="teal" x="545" y="485" width="410" height="75" rx="12"/><text class="sub" x="750" y="513" text-anchor="middle">Semantic clustering</text><text class="t" x="750" y="539" text-anchor="middle">Category · similarity · ticker · time</text>
<rect class="amber" x="1015" y="485" width="410" height="75" rx="12"/><text class="sub" x="1220" y="513" text-anchor="middle">Point-in-time signals + impact</text><text class="t" x="1220" y="539" text-anchor="middle">Novelty · corroboration · decay · heuristic 1-10</text>
<path class="arrow" d="M750 595 V625"/>
<rect class="purple" x="220" y="625" width="1060" height="82" rx="16"/><text class="sub" x="750" y="656" text-anchor="middle">4. CANONICAL FINANCIAL EVENT</text><text class="t" x="750" y="683" text-anchor="middle">Category / confidence · sentiment · impact · tickers · source provenance · cluster</text>
<path class="arrow" d="M750 707 V735 H390 V755"/><path class="arrow" d="M750 735 H1110 V755"/>
<rect class="blue" x="45" y="755" width="690" height="130" rx="16"/><text class="sub" x="390" y="785" text-anchor="middle">5A. MODULE A</text><text class="sub" x="390" y="812" text-anchor="middle">12-stock real-ticker mock-index rebalancer</text><text class="t" x="390" y="840" text-anchor="middle">Long-only weights · weight bounds · 10% turnover cap</text><text class="t" x="390" y="864" text-anchor="middle">Progressive synthetic replay snapshots</text>
<rect class="purple" x="765" y="755" width="690" height="130" rx="16"/><text class="sub" x="1110" y="785" text-anchor="middle">5B. MODULE B</text><text class="sub" x="1110" y="812" text-anchor="middle">Synthetic USD banking stress tester</text><text class="t" x="1110" y="840" text-anchor="middle">Negative sentiment + category + impact thresholds</text><text class="t" x="1110" y="864" text-anchor="middle">Loans / bonds / equities / cash / derivative-shock proxy</text>
<text class="t" x="55" y="930">Outputs: JSON/JSONL snapshots and histories · read-only FastAPI · local Streamlit synthetic replay</text>
</svg>
