name: Ingestion and impact-model tests

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pydantic>=2,<3" requests python-dotenv pytest pandas scikit-learn joblib rapidfuzz
      - name: Check Python syntax
        run: PYTHONPATH=. python -m compileall -q src tests
      - name: Run network-independent tests
        run: PYTHONPATH=. pytest -q tests/test_ingestion.py tests/test_live_ingestion.py tests/test_historical_impact.py tests/test_downstream_modules.py tests/test_entity_merge.py tests/test_semantic_clustering.py tests/test_live_ticker_universe.py tests/test_live_pipeline.py tests/test_event_intelligence.py
